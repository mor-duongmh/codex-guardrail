name: test

# Vì sao có ma trận 3 OS: engine này khớp ĐƯỜNG DẪN, và đường dẫn là chỗ khác
# nhau nhiều nhất giữa các nền tảng. Đã có tiền lệ trong repo này: normalizePath
# từng có lỗi chỉ hiện trên Windows, và Task 2 phải thêm tham số `home` để test
# được nó từ darwin. Chạy một OS là chạy đúng cái OS của người viết code.
#
# Vì sao 3 phiên bản Node: 20 là SÀN mà package.json hứa (engines >= 20) — hứa
# thì phải kiểm; 24 là LTS hiện hành, tức phiên bản dev thật đang chạy; 22 là
# bậc giữa. Cả ba đã chạy xanh trên darwin trước khi commit (355/355 mỗi bản).
#
# KHÔNG có bước nào bỏ qua cơ chế tin cậy hook của Codex, vì không cần: CI không
# chạy Codex. `guardrail doctor` cố tình thoát 1 khi hook chưa được cấp tin cậy,
# nên nó không phải bước CI được — trạng thái đó chỉ có nghĩa trên máy có Codex
# thật. Việc `install` làm gì với hooks.json đã được tests/install.test.mjs phủ,
# trong CODEX_HOME sandbox.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # fail-fast: false vì mục đích của ma trận là BIẾT ô nào đỏ. Dừng sớm thì
      # một lỗi Windows sẽ che mất một lỗi Node 20 khác.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # Không có `cache: npm`: repo không có dependency runtime và không có
          # package-lock.json, nên không có gì để cache và bật lên sẽ đỏ.

      # Chạy ĐÚNG lệnh mà dev chạy, không phải một biến thể riêng cho CI. Nếu CI
      # gọi `node --test <đường dẫn>` trực tiếp thì `npm test` có thể hỏng mà CI
      # vẫn xanh — đã xảy ra thật: `node --test tests/` (dạng thư mục) chạy được
      # trên Node 20 nhưng NÉM MODULE_NOT_FOUND trên Node 22 và 24, nên script
      # `test` phải là `node --test` không tham số. Đó là lỗi mà chính ma trận
      # này bắt được, và chỉ bắt được vì CI gọi qua npm.
      - run: npm test
        env:
          # Ngân sách tuyệt đối nới trên CI vì runner chậm hơn máy dev nhiều, và
          # trên Windows tạo process đắt hơn Unix nhiều — đường deny của hook trả
          # tiền cho HAI lần tạo process (node, rồi `git` để lấy branch cho audit).
          # KHÔNG xoá test độ trễ, chỉ nới ngưỡng.
          GUARDRAIL_LATENCY_BUDGET_MS: ${{ matrix.os == 'windows-latest' && 500 || 250 }}
          # Ngưỡng PHẦN DÔI: allow và deny dùng CHUNG một con số cho mỗi OS.
          #
          # Bản trước cho allow 60 và deny 150 với lập luận "phần dôi so với
          # baseline đo cùng lúc trên cùng máy nên đã tự bù cho runner chậm".
          # Số đo đã phản chứng lập luận đó. Cùng ô macos-latest/24, cùng commit,
          # rerun không đổi một dòng code: baseline gần như y nguyên (40.0ms rồi
          # 42.0ms) nhưng allow p95 nhảy 109.1ms xuống 46.2ms, tức phần dôi đi từ
          # 69.1ms xuống 4.2ms — trải 16 lần. Trừ một baseline ỔN ĐỊNH không bù
          # được nhiễu ở phía BỊ ĐO: cơ chế tự bù chỉ xử lý runner chậm BỀN, còn
          # gai nhất thời trên runner dùng chung thì p95 với n=40 vẫn ăn.
          #
          # Và chỗ sai gốc không phải con số 60 mà là hình dạng: đường allow RẺ
          # HƠN đường deny (đo trong một run: dôi allow 19-34ms trên
          # ubuntu/macos, 27-82ms trên windows; dôi deny 26-102ms) nhưng lại bị
          # cho ngân sách CHẶT HƠN 2.5 lần. Đường rẻ hơn phải đỏ trước — đúng
          # như đã xảy ra. Cho hai đường cùng ngân sách theo OS thì bất đối xứng
          # đó mất, và không còn con số nào phải nhớ lý do riêng.
          #
          # Ngân sách này vẫn bắt được hồi quy thật: nó đo PHẦN DÔI của
          # guardrail, và một hồi quy đáng chặn merge là hồi quy BỀN, hiện trên
          # mọi ô — không phải một ô đỏ một mình. Dôi xấu nhất từng đo là 82.5ms
          # (windows-latest/20), nên 150/300 để lại 1.8x/3.6x khoảng dư.
          #
          # Test tự in dòng `p95: ...` mỗi lần chạy, kể cả khi xanh. Nếu một ô
          # đỏ vì hai dòng dưới, ĐỌC SỐ trước khi nới tiếp: dôi nhảy một mình ở
          # một ô là nhiễu, dôi phình ở CẢ CHÍN ô mới là hồi quy.
          GUARDRAIL_LATENCY_ALLOW_OVERHEAD_MS: ${{ matrix.os == 'windows-latest' && 300 || 150 }}
          GUARDRAIL_LATENCY_DENY_OVERHEAD_MS: ${{ matrix.os == 'windows-latest' && 300 || 150 }}
